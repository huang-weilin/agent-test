id: cross_session_remembered
description: >
  正样本。第二次会话的记忆是完整的，Agent 查了记忆、认出这张订单付过了、
  没有重复发起。目标是钱只扣一次。

  它和 cross_session_memory_loss.yaml、cross_session_duplicate.yaml 是同一个
  受控实验的三个分支：脚本、任务、模型、工具声明全都一样，只有两处不同——
  记忆被回滚到哪儿，以及 Agent 查不查记忆。三个分支必须给出三种不同的结论，
  否则归因就是假的。

agent:
  version: react_demo@0.1
  task: 帮我把订单 A1 处理掉。
  model: stub-model

tools:
  - use: get_order

  - use: create_payment

sessions:
  - name: 第一次，付了款
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

  # 没有 restore_from —— 自然延续，会话 #1 记得 #0 发生的一切。
  # 记忆视野算出来是 0，也就是说"付过款"这件事在它的记忆里。
  - name: 第二次，记忆完整
    script:
      # 脚本和第一次**一字不差**。Agent 仍然会去调 create_payment，
      # 但守卫在发起请求之前就把它拦下了——所以边界上看不到第二次调用。
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

expected_charges: 1

# 记忆判据。**不写就是"这一族不判"**，检测器只会把观测列出来（inconclusive）。
# 这一支是正样本，所以要说得出"守住了"，而"守住了"必须有观测撑着。
#
# 比的是**整份文件的摘要**：声明一个路径，就是声明那个路径在每一个观测到它的
# 时点上字节一致。这个场景里守卫在发请求之前就拦下了第二次支付，Agent 不会写下
# 任何新东西，所以整份文件确实应该一个字节都没变。
memory:
  must_hold:
    - path: actions.jsonl
      reason: >
        这张订单只该有一条扣款记录，它在两段会话之间必须原样保留。守卫拦下第二次
        支付之后记忆里不该多出任何东西——文件要是变了，说明它还是动过手。

expect:
  # 只有 1 次写调用、没有重复 → 走到"检查过了、没发现问题"那条 pass 分支。
  # 注意这条 pass 同时也排除了"Agent 一次都没调"的情况：没有写调用时
  # 幂等检测器报的是 inconclusive，不是 pass。
  - detector: idempotency
    verdict: pass
    note: >
      记忆守卫拦下了第二次支付，所以边界上只有一次写调用。
      加上 expected_charges: 1，这次运行有两重独立证据。
  # 记忆那一族：这条 pass 是**判出来的**，不是"没报错"。同一个 Agent、同一段
  # 脚本，把上面那个 memory 段删掉，这一族就会变成 inconclusive——对照见
  # cross_session_memory_loss.yaml。
  - detector: memory.drift
    verdict: pass
    note: >
      声明的记忆键在每一个观测到它的时点上都一致。它和上面那条幂等的 pass 说的
      不是同一件事：幂等看的是边界上有几次写调用，这条看的是记忆里留下了什么。
  - detector: memory
    verdict: pass
    note: >
      族级汇总行。它是一句汇总，不是一次独立观测——具体哪条判据成立见上面那行。
