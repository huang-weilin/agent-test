id: cross_session_duplicate
description: >
  恢复到**付款之后**的快照，于是第二次会话的记忆里确实有那笔付款——但 Agent
  没有去查，又付了一次。钱扣了两次，这次是 Agent 的锅：它本可以认出来。

  和 cross_session_remembered.yaml 的差别**只有一个环境变量**：记忆守卫关掉了。
  记忆内容完全一样，都在那儿、都读得到。这就是"有记忆"和"用记忆"的区别，
  也是 cross_session_duplicate 和 cross_session_memory_loss 的区别所在。

agent:
  version: react_demo@0.1
  task: 帮我把订单 A1 处理掉。
  model: stub-model
  env:
    # 关掉记忆守卫 = 这个变体的缺陷是"不查记忆"。
    # 真实 Agent 没有这个开关，它是为了让同一个 Agent 能演两个变体而存在的；
    # 换成真实被测对象时，对应的是两份不同的实现。
    DEMO_AGENT_MEMORY_GUARD: "0"

tools:
  - name: get_order
    description: 按订单号查询订单详情。只读，无副作用。
    is_write: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
      required: [order_id]

  - name: create_payment
    description: 对指定订单发起支付。有副作用：每成功一次就产生一笔扣款。
    is_write: true
    idempotency_param: idempotency_key
    enforces_idempotency: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
        amount: {type: number, description: 金额}
        idempotency_key: {type: string, description: 幂等键}
      required: [order_id, amount]

sessions:
  - name: 第一次，付了款
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。
    # 拍在付款**之后**。位置是 (会话 0, seq≥1)，记忆视野算出来是 0——
    # 也就是说"付过款"这件事在第二次会话的记忆里。
    snapshot_after: after_pay

  - name: 第二次，记忆里有那笔付款但不查
    restore_from: after_pay
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

expected_charges: 2

expect:
  - detector: idempotency
    verdict: fail
    reason_code: cross_session_duplicate
    note: >
      归因指向 Agent。Agent 的 stdout 会打印"1 条记录"——记忆里有那笔付款，
      它是拿得到的，只是没用。这行输出是这条归因的证据，不是装饰。
