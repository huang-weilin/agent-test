id: cross_session_duplicate
description: >
  恢复到付款之后的快照，于是第二次会话的记忆里确实有那笔付款——但 Agent
  没有去查，又付了一次。钱扣了两次，这次是 Agent 的锅：它本可以认出来。

  和 cross_session_remembered.yaml 的差别只有一个环境变量：记忆守卫关掉了。
  记忆内容完全一样，都在那儿、都读得到。这就是"有记忆"和"用记忆"的区别，
  也是 cross_session_duplicate 和 cross_session_memory_loss 的区别所在。

agent:
  version: react_demo@0.1
  task: 帮我把订单 A1 处理掉。
  model: stub-model
  env:
    # 关掉记忆守卫 = 这个变体的缺陷是"不查记忆"。
    # 真实 Agent 没有这个开关，它是为了让同一个 Agent 能演两个变体而存在的；
    # 换成真实被测对象时，对应的是两份不同的实现。
    DEMO_AGENT_MEMORY_GUARD: "0"

tools:
  - use: get_order

  - use: create_payment

sessions:
  - name: 第一次，付了款
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。
    # 拍在付款**之后**。位置是 (会话 0, seq≥1)，记忆视野算出来是 0——
    # 也就是说"付过款"这件事在第二次会话的记忆里。
    snapshot_after: after_pay

  - name: 第二次，记忆里有那笔付款但不查
    restore_from: after_pay
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

expected_charges: 2

# 和 cross_session_remembered.yaml 用的是**同一条判据、同一个路径**，结论却相反
# ——两支的差别只有"Agent 查不查记忆"。这正是这一段值得写出来的地方：判据不是
# 按场景调的，是同一句话在两个世界里的两种结果。
#
# 这里比的是整份文件的摘要。这一支里它本该什么都不做（记忆里已经有那笔付款了），
# 所以"文件一模一样"就等于"它没再动过手"；反过来，文件变了就说明又记下了一笔。
memory:
  must_hold:
    - path: actions.jsonl
      reason: >
        会话 1 的记忆里已经有那笔付款了，它本该什么都不做。整份文件必须原样不动：
        它要是又扣了一次款，记忆里就会多出第二条同一个操作的记录，而那正是
        "没查记忆"在这个通道上留下的痕迹。

expect:
  - detector: idempotency
    verdict: fail
    reason_code: cross_session_duplicate
    note: >
      归因指向 Agent。Agent 的 stdout 会打印"1 条记录"——记忆里有那笔付款，
      它是拿得到的，只是没用。这行输出是这条归因的证据，不是装饰。
  # 同一个缺陷的另一个面。幂等那条看的是**边界**上多了一次写调用，这条看的是
  # **记忆**里多了一条记录——两条结论的证据互不依赖，所以它们对上时才是真对上。
  - detector: memory.drift
    verdict: fail
    reason_code: memory_value_changed
    note: >
      记忆文件在两个时点之间变了：第二条 create_payment:A1 被写了进去。注意这条
      结论没有说"是 Agent 弄丢了记忆"——那要另一组证据（记忆视野），而这里视野
      是够的，所以归因没有歧义。另一个成因见 cross_session_memory_loss.yaml。
  - detector: memory
    verdict: fail
    note: >
      族级汇总。它跟着上面那条具体结论一起变成 fail，本身不是一次独立观测。
