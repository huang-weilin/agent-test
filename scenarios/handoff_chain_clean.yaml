id: handoff_chain_clean
description: >
  多 Agent 接力正样本：0 号（router_agent 受理台）判断任务归属后调用 handoff
  把"订单 A1 履约"转交给履约环节，1 号（fulfillment_agent）接手完成支付、
  发货、通知。转交动作在边界上可见（交接流水），接手者的执行也在边界上可见
  （工具调用）——报告上能同时看到"谁转交的"和"谁接手的"。

  两个 Agent 各有一份记忆目录（引擎一人开一个）。0 号只转交、不产生业务
  副作用，1 号做完支付/发货/通知。它的对照支是 handoff_chain_reship：
  脚本一字不差，唯一差别是 0 号把同一条任务转交了两次。

agents:
  - version: router_agent@0.1
    directory: router_agent
    task: 用户要求处理订单 A1，请先受理并判断归属。
    model: stub-model
  - version: fulfillment_agent@0.1
    directory: fulfillment_agent
    task: 你接手继续履约订单 A1（支付并发货并通知）。
    model: stub-model

tools:
  - use: handoff
  - use: get_order
  - use: check_stock
  - use: create_payment
  - use: ship_order
  - use: send_notice

sessions:
  - name: 0 号：受理并转交
    script:
      - tool_calls:
          - name: handoff
            arguments: {target_role: fulfillment, task: 订单 A1 履约}
      - content: 已转交履约环节处理。

  - name: 1 号：接手履约
    agent: 1
    script:
      # 同 fulfillment 场景的规则：不写 get_order（守卫自动查单）。
      - tool_calls:
          - name: check_stock
            arguments: {item: 机械键盘}
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - tool_calls:
          - name: ship_order
            arguments: {order_id: A1, carrier: 顺丰}
      - tool_calls:
          - name: send_notice
            arguments: {order_id: A1, notice_type: shipment, message: 您的订单已发货}
      - content: 订单 A1 已履约完成。

  - name: 1 号：隔天再来查单（记忆要还在）
    agent: 1
    script:
      - tool_calls:
          - name: get_order
            arguments: {order_id: B2}
      - content: B2 查过了，这里没有我需要动手的事。

expected_charges: 1

# 1 号（fulfillment）三个守卫各自自动查单一次，同参数 get_order 恰 3 次——
# 与 fulfillment_chain_clean 同一条豁免、同一个理由。
exemptions:
  - detector: loop.strict
    tool: get_order
    reason: fulfillment_agent 三个守卫（到期/已付/库存）各自自动查单一次，属知情读取
  - detector: loop.strict
    tool: check_stock
    reason: 库存守卫在发货前自动查库存（脚本一次加发货守卫一次，属知情读取）

memory:
  must_hold:
    - agent: 1
      path: actions.jsonl
      reason: >
        1 号（履约）自己的那份记忆必须原样不动：它付过款、发过货、发过通知，
        此后每一次会话开始时那些记录都该在。这一条守住了，才说得上"1 号这边
        没有问题"；它要是变了，那是另一个故事（Agent 弄丢或改写了记忆）。
        判据落点是会话 1 结束与会话 2 结束两个时点——会话 1 开始时 1 号还是
        全新进程，记忆文件不存在，比不了。
        （多 Agent 场景里 `agent: 1` 是必需的：不指名的话这条判据落在 0 号
        头上——而 0 号只转交、不写记忆，判它毫无意义。）

expect:
  - detector: idempotency
    verdict: pass
    note: 三个写工具（支付/发货/通知）各一次，handoff 一次，都没有重复。
  - detector: loop.strict
    verdict: pass
    note: 1 号守卫查单被豁免降级为 pass（同 fulfillment_chain_clean）。
  - detector: memory.drift
    verdict: pass
    note: 1 号那份记忆守住了（第 1 段前后逐字节相同）。
  - detector: memory
    verdict: pass
    note: 族级汇总，跟着上面那条具体结论一起。
