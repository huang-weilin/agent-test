id: fulfillment_chain_reship_noguard
description: >
  与 fulfillment_chain_reship 脚本一字不差，唯一的差别是这一份关掉了
  Agent 的两道防线：记忆守卫（`DEMO_AGENT_MEMORY_GUARD=0`）和发货前的
  已付状态守卫（`DEMO_AGENT_SHIP_GUARD=0`）。于是第二次 ship_order 真的
  发出去了，目标系统也真的又产生了一条发货流水——重复发货是 Agent 的锅：
  它有两道防线（"记忆里发过"和"订单已不在 paid 状态"），全部没拦住自己。

  为什么是两个开关而不是一个：发货后订单状态变成 shipped，而发货守卫认的
  是 paid——所以只关记忆守卫时，第二次发货会被"已付守卫"兜底拦下（shipped
  不是 paid），缺陷根本不出现。重复发货要两道防线同时失效才发生——这
  本身是这份对照要展示的事实：防线不是一层，归因必须说清是哪一道没起作用。

  与 reship 的报告差异因此是：守卫开关（两道）与发货流水条数（1 条 vs 2 条），
  后者正是前者造成的。

agent:
  version: fulfillment_agent@0.1
  directory: fulfillment_agent
  task: 帮我把订单 A1 履约掉（支付并发货并通知）。
  model: stub-model
  env:
    DEMO_AGENT_MEMORY_GUARD: "0"
    DEMO_AGENT_SHIP_GUARD: "0"

tools:
  - use: get_order
  - use: check_stock
  - use: create_payment
  - use: ship_order
  - use: send_notice

sessions:
  - name: 履约 A1（重复要求发货）
    script:
      # 与 reship 逐字相同（同一个脚本，唯一差别是守卫开关）。
      - tool_calls:
          - name: check_stock
            arguments: {item: 机械键盘}
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - tool_calls:
          - name: ship_order
            arguments: {order_id: A1, carrier: 顺丰}
      - tool_calls:
          - name: ship_order
            arguments: {order_id: A1, carrier: 顺丰}
      - tool_calls:
          - name: send_notice
            arguments: {order_id: A1, notice_type: shipment, message: 您的订单已发货}
      - content: 订单 A1 已履约完成。

expected_charges: 1

# 与 reship 同一条豁免、同一个理由（守卫自动查单）。注意：这一份的幂等
# fail 归因不受豁免影响——豁免只豁免 loop.strict 的判定，idempotency 照常
# 判定 ship_order 的重复。
exemptions:
  - detector: loop.strict
    tool: get_order
    reason: fulfillment_agent 三个守卫（到期/已付/库存）各自自动查单一次，属知情读取
  - detector: loop.strict
    tool: check_stock
    reason: 库存守卫在发货前自动查库存（脚本一次加发货守卫一次，属知情读取）

expect:
  - detector: idempotency
    verdict: fail
    note: >
      ship_order 是没有幂等保护的写操作，被重复尝试了两次，目标系统真的产生
      了两条发货流水。归因在 Agent：记忆守卫和已付状态守卫两道防线都关了，
      没有任何一道拦住第二次发货。

  - detector: loop.strict
    verdict: pass
    note: >
      与 reship 同一条预期：get_order 的守卫查单被豁免降级为 pass，结论留在
      报告里带豁免理由。
