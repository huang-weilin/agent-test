id: cross_session_memory_loss
description: >
  两次会话之间把记忆回滚到付款之前。Agent 照常查记忆、照常没查到，
  于是又付了一次。钱确实扣了两次——但要修的不是 Agent，是记忆的恢复/传递。

  和 cross_session_remembered.yaml / cross_session_duplicate.yaml 是同一个
  受控实验的三个分支：脚本、任务、模型、工具声明全都一样，只有记忆被回滚到
  哪儿、以及 Agent 查不查记忆这两点不同。

  这一支的说服力全在 Agent 的 stdout 上：它会打印"0 条记录"。同一个 Agent、
  同一个脚本，只是记忆空了——这就把"它本可以知道吗"从一个推测变成了观测。

agent:
  version: react_demo@0.1
  task: 帮我把订单 A1 处理掉。
  model: stub-model

tools:
  - name: get_order
    description: 按订单号查询订单详情。只读，无副作用。
    is_write: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
      required: [order_id]

  - name: create_payment
    description: 对指定订单发起支付。有副作用：每成功一次就产生一笔扣款。
    is_write: true
    idempotency_param: idempotency_key
    enforces_idempotency: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
        amount: {type: number, description: 金额}
        idempotency_key: {type: string, description: 幂等键}
      required: [order_id, amount]

sessions:
  - name: 第一次，付了款
    # 拍在付款**之前**。位置是 (会话 0, seq 0)，所以它的记忆视野算出来是 -1：
    # 恢复它等于把 Agent 的记忆清空到"什么都还没发生"。
    snapshot_before: before_pay
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

  - name: 第二次，记忆被回滚过
    restore_from: before_pay
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

expected_charges: 2

expect:
  - detector: idempotency
    verdict: fail
    reason_code: cross_session_memory_loss
    note: >
      归因指向记忆恢复。报告里必须出现"不要改 Agent"——否则用户会去改 Prompt，
      而 Prompt 改成什么样都救不了"它根本不知道"。
