kind: control
id: cross_session_memory_loss
description: >
  两次会话之间把记忆回滚到付款之前。Agent 照常查记忆、照常没查到，
  于是又付了一次。钱确实扣了两次——但要修的不是 Agent，是记忆的恢复/传递。

  和 cross_session_remembered.yaml / cross_session_duplicate.yaml 是同一个
  对比实验的三个分支：脚本、任务、模型、工具配置全都一样，只有记忆被回滚到
  哪儿、以及 Agent 查不查记忆这两点不同。

  这一支的说服力全在 Agent 的 stdout 上：它会打印"0 条记录"。同一个 Agent、
  同一个脚本，只是记忆空了——这就把"它本可以知道吗"从一个推测变成了观测。

agent:
  version: react_demo@0.1
  task: 帮我把订单 A1 处理掉。
  model: stub-model

tools:
  - use: get_order

  - use: create_payment

sessions:
  - name: 第一次，付了款
    # 拍在付款**之前**。位置是 (会话 0, seq 0)，所以它的记忆视野算出来是 -1：
    # 恢复它等于把 Agent 的记忆清空到"什么都还没发生"。
    snapshot_before: before_pay
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

  - name: 第二次，记忆被回滚过
    restore_from: before_pay
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

expected_charges: 2

# 这一支刻意**不声明**记忆判据，和另外两支不同——不是漏了。
#
# 这儿的记忆是我们自己回滚掉的：会话 1 的记忆视野早于那笔付款写下的时刻。要是在
# 这里写一句"actions.jsonl 必须保持"，那句话和"回滚到付款之前"是直接矛盾的，
# 检测器会照实指出来（memory_rolled_back，两条声明互相矛盾，得由人决定去掉哪条）。
# 场景自己要的就是那次回滚，所以该去掉的是判据那一条。
#
# 于是三支正好落在记忆族的三种结论上：declared/pass（remembered）、
# declared/fail（duplicate）、没声明/只观测（这一支）。第三种**不是**"没问题"
# ——报告里它会说"观测到了 N 个时点，但场景没有声明判据"。把 inconclusive 读成
# pass 是这一族最容易犯的错，所以留一支真的不声明的场景在这儿。

expect:
  - detector: idempotency
    verdict: fail
    reason_code: cross_session_memory_loss
    note: >
      归因指向记忆恢复。报告里必须出现"不要改 Agent"——否则用户会去改 Prompt，
      而 Prompt 改成什么样都救不了"它根本不知道"。
