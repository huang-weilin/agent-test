id: duplicate
description: >
  同一个订单、同样金额付两次。写操作，目标系统侧没实现幂等。这是最直白的
  重复扣款：钱真的扣两次，检测器报 fail。

agent:
  version: react_demo@0.1
  task: 帮我把订单 A1 处理掉。
  model: stub-model

tools:
  - name: get_order
    description: 按订单号查询订单详情。只读，无副作用。
    is_write: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
      required: [order_id]

  - name: create_payment
    description: 对指定订单发起支付。有副作用：每成功一次就产生一笔扣款。
    is_write: true
    idempotency_param: idempotency_key
    enforces_idempotency: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
        amount: {type: number, description: 金额}
        idempotency_key: {type: string, description: 幂等键}
      required: [order_id, amount]

sessions:
  - name: 重复支付
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 支付完成。

expect:
  # 这里**刻意不写 reason_code**：目标系统侧根本没实现幂等，检测器走的是
  # "没有幂等保护的写操作被重复执行"那条分支，它不带 reason_code。
  # 带键与否在保护缺失的前提下不影响结论——反正都会真扣两次。
  # 那种"工具声明了保护、Agent 却不带键"的缺陷是另一个场景，见 missing_key.yaml。
  - detector: idempotency
    verdict: fail
    note: 两次支付都会真实扣款，必须报出来。
