id: cross_session_handoff
description: >
  两个 Agent 接力：0 号跑第一段把订单 A1 付掉，1 号跑第二段、又付了一次。
  两次都到达目标系统并成功，钱扣了两笔——但这不是哪一个 Agent 的错。

  串联的时候两个人各有一份记忆目录（引擎一人开一个，通过环境变量交给它），
  所以 0 号不知道 1 号会做什么，1 号也从来没见过 0 号那条记录。没有谁
  "本可以知道"这件事，也就没有谁的判重逻辑需要改。

  这是同一个现象（A1 被扣了两次）的第三种成因，另两种见 cross_session_duplicate
  与 cross_session_memory_loss：一个是"记忆里有、它没去用"（Agent 的锅），
  一个是"记忆被回滚掉了"（恢复机制的锅）。三份的结论都是 fail（钱确实扣了两次），
  区别全在报告说该去修哪儿。

  它的对照支是 cross_session_same_agent：同一段脚本、同样三段会话，唯一
  的差别是第二段换不换人。不换，就只扣一笔——也就是说这两个 Agent 各自都没
  做错什么，出问题的是接缝。

agents:
  - version: react_demo@0.1
    task: 帮我把订单 A1 处理掉。
    model: stub-model
  - version: react_demo@0.2
    task: 你接手继续处理订单 A1。
    model: stub-model

tools:
  - use: get_order

  - use: create_payment

sessions:
  - name: 第一段：付 A1
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

  - name: 第二段：再处理一次 A1
    agent: 1
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

  - name: 第三段：又过了一段，还是 A1
    script:
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付。

# 两次：第一段的 0 号一次，第二段的 1 号一次。第三段没有第三笔——
# 边界上什么都看不到，这正是"守卫拦住了"唯一的证据。
expected_charges: 2

memory:
  # 只给 0 号写判据。**1 号的记忆判据在这一支里写不出来**：它只跑了一段，
  # 记忆只有"开始"和"结束"两个时点，那条键只在第二个时点出现——没有下一个
  # 时点可以比对，任何 must_hold 都只能得到"看不出来"。写一条注定 inconclusive
  # 的判据，读报告的人会以为在看一个结论。
  must_hold:
    - agent: 0
      path: actions.jsonl
      reason: >
        0 号自己的那份记忆必须原样不动：它付过一次款，此后每一次会话开始时
        那条记录都该在，结束时也还是那一条——它不该再写出第二条来。这一条
        守住了，才说得上"0 号这边没有问题"；它要是变了，那就成了另一个故事
        （Agent 弄丢或改写了记忆），而那要记在它头上。
        （这一条判的是 0 号那份记忆：`agent: 0` 是必需的，串联场景里
        没有它这条判据落在谁头上就不定。）

expect:
  - detector: idempotency
    verdict: fail
    reason_code: cross_session_handoff
    note: >
      归因指向**接缝**，不是任何一个人。判据还是那条判据（同一操作在两个
      会话里各做了一遍，钱扣了两次），不同的是首尾两段的 agent_index 不一
      样——于是那句"去修记忆的恢复/传递"说不出口：这里没有人回滚过任何
      东西。报告里要说的是"要么让它们共用一份记忆，要么在交接的时候把上
      一段的结论传过去"。

  - detector: memory.drift
    verdict: pass
    note: >
      0 号那份记忆守住了（第 2 段前后逐字节相同）。这条 pass 是上面那条
      归因的**另一半证据**：它说明 0 号记得住自己做过的事，所以第一段和
      第二段的重复不能记在它头上——它没有"忘了"，是那件事从来没有进过
      1 号的记忆。

  - detector: memory
    verdict: pass
    note: >
      族级汇总。它跟着上面那条具体结论一起是 pass，本身不是一次独立观测。
