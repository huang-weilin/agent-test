kind: control
id: schema_keys_undeclared
description: >
  声明只说了「参数是个对象」，没说键是怎样的。边界于是只核对这一条，不替它发明
  一份键的名单——两次带着真实参数的调用照常到达目标系统，报告里一条 tool_schema
  都没有。

  它与 schema_empty_properties.yaml 是对比场景：脚本、任务、世界、工具名完全一样，
  唯一的差别是声明里有没有 properties 这一行（那边给的是一个空表）。两边的结论必须
  相反——这就是「空表和没给是两件事」在边界上的样子。

agent:
  version: react_demo@0.1
  task: 看一下还没支付的订单有哪些。
  model: stub-model

tools:
  - use: list_orders
    parameters:
      # 键一个都没列。**这不是漏检**：没有可对照的东西，不核对是如实的；凭空造一份
      # 「一个键都不许」的名单才是错的——那会让这个工具的每一次调用都过不去，而报告
      # 上写着「Agent 参数送错了」（见 toolschema 的模块 docstring）。
      type: object

sessions:
  - name: 正常翻两页
    script:
      - tool_calls:
          - name: list_orders
            arguments: {status: unpaid, page: 1, page_size: 20}
      - tool_calls:
          - name: list_orders
            arguments: {status: unpaid, page: 2, page_size: 20}
      - content: 未支付的订单翻了两页，都拿到了。

expected_charges: 0

# 这份声明不产生任何结论：它没违规，而参数核对**没有正样本结论**（守规矩的调用
# 一条都不产出，见 docs/detectors.md 第六节）。"它没有被判成参数错误"这件事由
# tests/test_undeclared_keys.py 从库里读回来说话。
expect: []
