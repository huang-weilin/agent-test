id: planner_chain_clean
description: >
  规划-执行正样本：会话 0 把任务拆成计划（create_plan 落到任务计划板——
  世界的共享工件，不是 Agent 记忆），会话 1 醒来先读计划（get_plan），按
  计划执行（查单、支付），并 mark_step_done 标记进度。全绿。

  这一份证明的是"计划作为跨会话上下文"的完整链路：计划在会话 0 写、在
  会话 1 读，而会话 1 的 Agent 进程是全新拉起的——它知道该做什么的唯一
  途径就是计划板（加上自己的长效记忆）。

agent:
  version: planner_agent@0.1
  directory: planner_agent
  task: 规划并执行：处理订单 A1（支付）。
  model: stub-model

tools:
  - use: create_plan
  - use: get_plan
  - use: mark_step_done
  - use: get_order
  - use: create_payment

sessions:
  - name: 0 号：写计划
    script:
      - tool_calls:
          - name: create_plan
            arguments: {plan_id: plan-main, steps: [查单 A1, 支付 A1]}
      - content: 计划已创建：先查单，再支付。

  - name: 1 号：读计划并执行
    script:
      - tool_calls:
          - name: get_plan
            arguments: {plan_id: plan-main}
      - tool_calls:
          - name: get_order
            arguments: {order_id: A1}
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - tool_calls:
          - name: mark_step_done
            arguments: {plan_id: plan-main, step_index: 1}
      - content: 按计划完成：订单 A1 已支付。

  - name: 2 号：隔天再看看计划还在不在
    script:
      - tool_calls:
          - name: get_plan
            arguments: {plan_id: plan-main}
      - content: 计划还在，进度也在，没有需要动手的事。

expected_charges: 1

memory:
  must_hold:
    - path: actions.jsonl
      reason: >
        同一 Agent 三段时间：会话 0 只把计划落到计划板（不写记忆），记忆在
        会话 1 支付时才产生，所以判据落点是会话 1 结束与会话 2 结束两个时点
        （会话 0 结束 / 会话 1 开始时 actions.jsonl 还不存在，比不了）。
        "支付记录守住"成立，才说得上这个 Agent 没弄丢自己做过的事。

expect:
  - detector: idempotency
    verdict: pass
    note: create_plan、mark_step_done、create_payment 各一次，没有重复写操作。
  - detector: memory.drift
    verdict: pass
    note: 记忆在会话 1 支付时产生、会话 2 结束仍在，逐字节相同。
  - detector: memory
    verdict: pass
    note: 族级汇总，跟着上面那条具体结论一起。
