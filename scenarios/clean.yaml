id: clean
description: >
  负样本。读订单、付款一次、结束。什么都不该报——这是用来证明检测器
  不是"凡跑必红"的对照场景。

agent:
  version: react_demo@0.1
  task: 帮我把订单 A1 处理掉。
  model: stub-model

tools:
  - name: get_order
    description: 按订单号查询订单详情。只读，无副作用。
    is_write: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
      required: [order_id]

  - name: create_payment
    description: 对指定订单发起支付。有副作用：每成功一次就产生一笔扣款。
    is_write: true
    idempotency_param: idempotency_key
    enforces_idempotency: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
        amount: {type: number, description: 金额}
        idempotency_key: {type: string, description: 幂等键}
      required: [order_id, amount]

sessions:
  - name: 正常处理
    script:
      - tool_calls:
          - name: get_order
            arguments: {order_id: A1}
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付 599 元。

expected_charges: 1

expect:
  - detector: idempotency
    verdict: pass
    note: 只付了一次，不该报重复扣款。
  - detector: loop
    verdict: pass
    note: 三步就走完了，三项循环检查都该是干净的。

# 这个场景只有 1 个会话，所以 loop.cross_session 会给出 inconclusive。
# 它不会被匹配、也不会算失败，而是出现在报告的"未覆盖"一栏——跨会话那一路
# 确实没被这个场景测到，如实说比假装绿灯强。
