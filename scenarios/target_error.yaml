id: target_error
description: >
  目标系统报错之后它做了什么。脚本让它问一个不存在的订单——目标系统回 404，
  这是边界上能拿到的最硬的一种"出错"——然后原样再问一次，再换成存在的订单问，
  最后正常付款。

  这个场景是给调用链那一节用的：没有一次真实的失败，那一节就永远只有"没有一次
  不成功"，没法证明它写得对。同时它钉住另一件事：目标系统回错 + 原样重试一次，
  不许被报成循环或缺陷——那是发生在这条链上的事，不是它做错的事。

  链上 `get_order(A1)` 会出现两次，其中一次是演示 Agent 付款前自己查到期
  （`CHECK_DUE`），不是脚本写的——脚本只让它查一次 A1。

agent:
  version: react_demo@0.1
  task: 帮我把订单处理掉。
  model: stub-model

tools:
  - use: get_order

  - use: create_payment

sessions:
  - name: 目标系统报错之后
    script:
      # NOPE 不在目标系统的订单表里，这两次都会被回 404。两次都写在脚本里是
      # 刻意的：链上要有一条"紧接着又是一次同样的调用"。
      - tool_calls:
          - name: get_order
            arguments: {order_id: NOPE}
      - tool_calls:
          - name: get_order
            arguments: {order_id: NOPE}
      # 换成存在的那一个——链上就有了"还是这个工具，参数变了"。
      - tool_calls:
          - name: get_order
            arguments: {order_id: A1}
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付 599 元。

expected_charges: 1

expect:
  - detector: idempotency
    verdict: pass
    note: 只付了一次。前面那两次 404 问的是订单，不是钱。
  - detector: loop
    verdict: pass
    note: >
      两次一模一样的只读调用不算循环（严格层要三次），而且它随后换成了存在的
      订单。目标系统回错不该被读成它在原地打转。

# 这里**不写 tool_scope 的预期**：那个检测器只在自己被触发时说话，干净的时候
# 一条结论都不产出。写一条 `pass` 进去会永远是"未命中"，把一次正常的运行判成
# 不通过——一个检测器沉默是它对，不是它没查。
#
# `get_order(NOPE)` 那两次在边界上留下的是 status=error，调用链里会各占一行、
# 合并成一步（同样的调用出现 2 次）。**它不进 findings**：目标系统回了个错，
# 是发生在这条链上的事，不是被测对象做错了事。
