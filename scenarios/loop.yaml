id: loop
description: >
  反复查同一个订单、停不下来。8 次完全相同的只读调用。这是最容易被漏报的
  一类——它不花钱在副作用上，只烧钱和上下文，所以没有幂等检测器会碰它。

agent:
  version: react_demo@0.1
  task: 帮我把订单 A1 处理掉。
  model: stub-model

tools:
  - name: get_order
    description: 按订单号查询订单详情。只读，无副作用。
    is_write: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
      required: [order_id]

  - name: create_payment
    description: 对指定订单发起支付。有副作用：每成功一次就产生一笔扣款。
    is_write: true
    idempotency_param: idempotency_key
    enforces_idempotency: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
        amount: {type: number, description: 金额}
        idempotency_key: {type: string, description: 幂等键}
      required: [order_id, amount]

sessions:
  # 脚本里没有 content 步骤，所以这个循环不会自己停——它只会停在上游脚本
  # 耗尽时那句强制终止。因此这一段的消费量会是 9 而不是 8，见 runner 里
  # 关于"消费量 >= 声明量"的检查。
  - name: 停不下来的查询
    script:
      - tool_calls: [{name: get_order, arguments: {order_id: A1}}]
      - tool_calls: [{name: get_order, arguments: {order_id: A1}}]
      - tool_calls: [{name: get_order, arguments: {order_id: A1}}]
      - tool_calls: [{name: get_order, arguments: {order_id: A1}}]
      - tool_calls: [{name: get_order, arguments: {order_id: A1}}]
      - tool_calls: [{name: get_order, arguments: {order_id: A1}}]
      - tool_calls: [{name: get_order, arguments: {order_id: A1}}]
      - tool_calls: [{name: get_order, arguments: {order_id: A1}}]

expected_charges: 0

expect:
  - detector: loop.strict
    verdict: fail
    note: >
      8 次完全相同的调用，远超阈值。严格层判出来后看门狗会带外熔断——
      所以 Agent 进程可能不是正常退出，退出码不为 0 是预期内的。
