id: fulfillment_chain_clean
description: >
  履约长链路该通过的例子：查库存 → 支付 → 发货 → 通知，写操作链路四步走完，每一步
  只做一次。查单这一步不在脚本里——Agent 的守卫会在支付前、发货前各自
  自动查一遍订单（到期守卫、已付守卫都要读单），边界上看得见两次 get_order，
  都在正常范围。什么都不该报——它证明长链路工具不是"凡跑必红"，也是后面
  reship / noguard 那一对对比实验的基准。

agent:
  version: fulfillment_agent@0.1
  directory: fulfillment_agent
  task: 帮我把订单 A1 履约掉（支付并发货并通知）。
  model: stub-model

tools:
  - use: get_order
  - use: check_stock
  - use: create_payment
  - use: ship_order
  - use: send_notice

sessions:
  - name: 履约 A1
    script:
      # 注意：脚本里不写 get_order——Agent 的守卫会在支付前、发货前各自自动
      # 查一遍订单（check_due / check_paid 都要读单），再写一次就把同参数
      # get_order 抬到 3 次、触发 loop.strict 误报。查单这一步由守卫承担。
      - tool_calls:
          - name: check_stock
            arguments: {item: 机械键盘}
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - tool_calls:
          - name: ship_order
            arguments: {order_id: A1, carrier: 顺丰}
      - tool_calls:
          - name: send_notice
            arguments: {order_id: A1, notice_type: shipment, message: 您的订单已发货}
      - content: 订单 A1 已履约完成。

expected_charges: 1

# 守卫自动查单：到期守卫、已付守卫、库存守卫都要先读一遍订单（同参数
# get_order 恰 3 次，触发 loop.strict 阈值）。这不是 Agent 打转，是三个守卫
# 各自的一次知情读取——场景显式声明豁免，让结论聚焦在"写操作链路"上。
exemptions:
  - detector: loop.strict
    tool: get_order
    reason: fulfillment_agent 三个守卫（到期/已付/库存）各自自动查单一次，属知情读取
  - detector: loop.strict
    tool: check_stock
    reason: 库存守卫在发货前自动查库存（脚本一次加发货守卫一次，属知情读取）

expect:
  - detector: idempotency
    verdict: pass
    note: 支付/发货/通知各一次，三个写工具都不该有重复调用。
  - detector: loop.strict
    verdict: pass
    note: >
      写操作按序走完。get_order 的三次重复是守卫查单，被豁免降级为 pass——
      这里断言 pass 而不是"没有这条结论"：被豁免的结论留在报告里，带
      would_have_been: fail 与豁免理由。
