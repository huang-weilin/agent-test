id: stream_clean
description: >
  和 clean.yaml 是同一个世界、同一段脚本、同一个 Agent，唯一的变量是
  `DEMO_AGENT_STREAM`：这个场景里 Agent 用流式请求打网关（`stream: true`），
  对照组用非流式。要证的是「换一种传输方式不改行为」——结论该一字不差，
  而账要从上游的 usage 来，不能是网关估的。受控对照的判据在
  `tests/control_pairs.py` 的账本里，不在这段话里。

agent:
  version: react_demo@0.1
  task: 帮我把订单 A1 处理掉。
  model: stub-model
  env:
    DEMO_AGENT_STREAM: "1"

tools:
  - name: get_order
    description: 按订单号查询订单详情。只读，无副作用。
    is_write: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
      required: [order_id]

  - name: create_payment
    description: 对指定订单发起支付。有副作用：每成功一次就产生一笔扣款。
    is_write: true
    idempotency_param: idempotency_key
    enforces_idempotency: false
    parameters:
      type: object
      properties:
        order_id: {type: string, description: 订单号}
        amount: {type: number, description: 金额}
        idempotency_key: {type: string, description: 幂等键}
      required: [order_id, amount]

sessions:
  - name: 正常处理
    script:
      - tool_calls:
          - name: get_order
            arguments: {order_id: A1}
      - tool_calls:
          - name: create_payment
            arguments: {order_id: A1, amount: 599.0}
      - content: 订单 A1 已支付 599 元。

expected_charges: 1

expect:
  - detector: idempotency
    verdict: pass
    note: 只付了一次，不该报重复扣款。
  - detector: loop
    verdict: pass
    note: 三步就走完了，三项循环检查都该是干净的。
