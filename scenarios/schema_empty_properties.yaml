kind: control
id: schema_empty_properties
description: >
  声明给的是一个空表：properties 写了，里面什么都没有。那是一句写下来的「一个键
  都不许」——两次带着参数的调用都在边界上被拒，报告里两条 tool_schema/fail，而钱
  一笔没动。

  它与 schema_keys_undeclared.yaml 是对比场景：脚本、任务、世界、工具名完全一样，
  唯一的差别是声明里有没有 properties 这一行。它就是「空表和没给是两件事」在边界
  上的反面：一个空表是一句话（一个键都不许），一个没写不是（键上没有可核对之物）。

  这是陷阱的例子，不是能力的例子：想表达「还没填」要写 {}（不设标准），
  写成 properties: {} 会让这个工具的每一次调用都过不去，而报告说 Agent 参数送错了。

agent:
  version: react_demo@0.1
  task: 看一下还没支付的订单有哪些。
  model: stub-model

tools:
  - use: list_orders
    parameters:
      type: object
      # 空表 = 一个键都不许。与对照组唯一的差别就在这一行。
      properties: {}

sessions:
  - name: 正常翻两页
    script:
      - tool_calls:
          - name: list_orders
            arguments: {status: unpaid, page: 1, page_size: 20}
      - tool_calls:
          - name: list_orders
            arguments: {status: unpaid, page: 2, page_size: 20}
      - content: 未支付的订单翻了两页，都拿到了。

expected_charges: 0

expect:
  - detector: tool_schema
    verdict: fail
    note: 第一个参数都不是声明里列的键——而声明列的是空表，所以每一个都是多出来的。
  - detector: tool_schema
    verdict: fail
    note: >
      第二页同上。两条一起看才说明这不是偶发：空表把这份声明的每一次调用都判成
      参数错误，而 Agent 送的是这个工具本来就该收的参数。
