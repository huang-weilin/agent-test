[project]
name = "agent-test-sandbox"
version = "0.0.1"
description = "AI Agent 行为级测试沙盒 —— 独立、对抗性的行为验证"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    # 场景文件是 YAML，而场景 DSL 是核心功能不是可选项，所以显式声明。
    # 之前它只是靠 uvicorn[standard] 传递进来的——传递依赖哪天被上游砍掉，
    # 场景加载会在一个和 YAML 毫无关系的地方报 ImportError。
    "pyyaml>=6.0",
    # Web 界面的模板引擎。**不是为了排版好看，是为了自动转义。**
    # 报告里的检测器结论、Agent 的 stdout、工具参数全是外部输入，手写
    # f-string 拼 HTML 意味着每一处都要记得 html.escape，漏一处就是一个 XSS。
    # 模板引擎默认全转义，漏不掉。
    "jinja2>=3.1",
    # 解析 HTML 表单。界面上的保存/运行都是 form POST——**刻意不走 JSON**，
    # 这样没有 JavaScript 也能用。FastAPI 的 `Form()` 在缺它时直接抛错
    # （不是降级），所以必须显式声明，不能指望谁把它传递进来。
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# LiteLLM 不放在核心依赖：依赖树很大，且是网关层的实现细节。
# W3 开工网关时再 `pip install litellm`，并在此处锁版本。
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
# 领域模型 TestRun 与 pytest 默认的 Test* 类收集规则撞名。
# 我们的测试全用函数式（或夹具），不用测试类，所以直接关掉类收集，
# 而不是为了迁就 pytest 去改一个命名正确的领域实体。
python_classes = []
