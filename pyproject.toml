[project]
name = "agent-test-sandbox"
version = "0.0.1"
description = "AI Agent 行为级测试沙盒 —— 独立、对抗性的行为验证"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "structlog>=24.4",
]

[project.optional-dependencies]
# LiteLLM 不放在核心依赖：依赖树很大，且是网关层的实现细节。
# W3 开工网关时再 `pip install litellm`，并在此处锁版本。
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
# 领域模型 TestRun 与 pytest 默认的 Test* 类收集规则撞名。
# 我们的测试全用函数式（或夹具），不用测试类，所以直接关掉类收集，
# 而不是为了迁就 pytest 去改一个命名正确的领域实体。
python_classes = []
