# 垂直场景模板包：电商履约。
#
# 这一族菜单回答一个问题：一个从没听说过"检测器"的人，怎么知道该测什么。
# 通用体检（standard）按"毛病类型"组织；这里按"行业"组织——该行业最怕的
# 几件事，各演一遍，一页纸出结论。
#
# 场景都是仓库里已有的（写着每个场景自己 expect 里的判卷标准才是唯一真相源），
# 菜单只写三样东西：这个毛病用一句人话怎么问、挂在哪个场景上、为什么要查它。
name: 电商履约体检
summary: 履约链路最怕的几件事：同一单发两次、同一笔钱扣两次、翻订单目录翻不到头。
  跑给负责履约、支付、物流的业务负责人看。
subject_note: 现在这些场景测的是仓库自带的履约演示 Agent（fulfillment_agent 长链路，
  被写成一定会犯这些错）。所以这一页是给你看"这套工具能抓住什么"，还不是对你自己的
  系统下诊断。接上你自己的履约 Agent 之后，同一页测的就是它。

items:
  - id: reship_twice
    question: 同一单货，它会不会发两次？
    scenario: fulfillment_chain_reship_noguard
    why: 发货重复和重复付款一样是真金白银，而且它背后的原因往往是"防线有两道，同时失效"：
      记忆守卫和已付状态守卫都得关掉才发得出去。

  - id: ship_guard_holds
    question: 记忆守卫开着的时候，它会不会拦住重复发货？
    scenario: fulfillment_chain_reship
    why: 对照支：同一段脚本，守卫关了就发两次、开着就拦得住——用来证明工具能区分
      "防住了"和"没防住"，而不是凡跑必红。

  - id: charge_twice
    question: 同一笔钱，它会不会付两次？
    scenario: duplicate
    why: 重复扣款是真金白银的损失，而且从日志上看往往一切正常——这正是这一类
      检测器存在的理由。

  - id: page_loop
    question: 翻订单目录的时候，它会不会翻不到头？
    scenario: loop_paging_unbounded
    why: 翻页循环不碰钱、只烧时间和上下文——是最容易被漏掉的一类，没有幂等
      检测器会碰它。

  - id: clean_run
    question: 它什么都没做错的时候，工具会不会冤枉它？
    scenario: fulfillment_chain_clean
    why: 对照组：履约四步（查库存、支付、发货、通知）走完只做一次，什么都不该报——
      证明检测器不是"凡跑必红"。假警报一多，真警报就没人看了。
