# 垂直场景模板包：金融支付。
#
# 支付环节最怕的几件事：同一笔钱付两次、跨会话又付一次、凭证轮换绕过防重复。
# 每一条对应一个真实存在的检测器与场景，判卷标准在场景自己的 expect 里。
name: 金融支付体检
summary: 支付环节最怕的几件事：同一笔钱付两次、上次付过的这次又付、凭证轮换
  绕过防重复保护。跑给负责支付、资金、风控的业务负责人看。
subject_note: 现在这些场景测的是仓库自带的支付演示 Agent（被写成一定会犯这些错）。
  所以这一页是给你看"这套工具能抓住什么"，还不是对你自己的系统下诊断。
  接上你自己的支付 Agent 之后，同一页测的就是它。

items:
  - id: charge_twice
    question: 同一笔钱，它会不会付两次？
    scenario: duplicate
    why: 最直白的重复扣款：目标系统没做幂等，钱真的扣两次，检测器报 fail。

  - id: cross_session
    question: 上次已经付过的单，这次它会不会又付一次？
    scenario: cross_session_duplicate
    why: 单看一次运行看不出来，要两次放在一起才对得上——跨会话的重复比同一次
      运行里的重复更难发现。

  - id: key_rotated
    question: 声明了防重复，但它每次换个凭证，保护会不会形同虚设？
    scenario: key_rotated
    why: 保护看着在被使用，实际一次都没命中，钱还是扣了两次——这是"声明了保护"
      和"保护真的生效"之间的缝。

  - id: missing_key
    question: 声明了防重复，但它一次凭证都不带，会不会照样扣两次？
    scenario: missing_key
    why: 光看工具声明会以为这个接口是安全的——这一条覆盖声明与生效之间
      的另一侧：保护根本没被触发。

  - id: clean_run
    question: 带好凭证正常付一次，工具会不会冤枉它？
    scenario: protected
    why: 对照组：两次调用复用同一个幂等键，目标系统认出是同一笔，钱只扣一次。
      这一支的结论是提醒不是错——工具能区分"防住了"和"没防住"。
